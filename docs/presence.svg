<rect x="432" y="120" width="330" height="118" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
<text x="597" y="154" font-size="22" fill="#047857" text-anchor="middle" font-weight="bold" >Presence</text>
<text x="597" y="180" font-size="15" fill="#065f46" text-anchor="middle" font-weight="normal" >a dog wants out</text>
<text x="597" y="210" font-size="15" fill="#065f46" text-anchor="middle" font-weight="bold" >opens the door in ~0.5 s</text>
<rect x="432" y="262" width="330" height="138" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" />
<text x="597" y="296" font-size="22" fill="#b45309" text-anchor="middle" font-weight="bold" >Occupied</text>
<text x="597" y="322" font-size="15" fill="#92400e" text-anchor="middle" font-weight="normal" >anything in the doorway</text>
<text x="597" y="352" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold" >the door never closes on it</text>
<text x="597" y="376" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold" >and a closing door reverses</text>
<text x="597" y="428" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >Occupied is the more sensitive of the two: a false alarm only delays</text>
<text x="597" y="444" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >a close, so the door errs on the side of the dog.</text>
