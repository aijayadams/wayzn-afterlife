<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Helvetica, Arial, sans-serif">
<title>How the door sees your dog</title>
<rect x="0" y="0" width="1200" height="470" rx="0" fill="#ffffff" stroke="none" stroke-width="2" />
<text x="600" y="44" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold" >How the door sees your dog</text>
<text x="600" y="70" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >A tiny 8×8 thermal camera watches the doorway 10 times a second. Every pixel learns its own background and noise, so a dog stands out even when it only warms a pixel or two.</text>
