; wayzn-brain production firmware (ESP32 on the Wayzn WYP-BC-100). See src/main.cpp.
; Wi-Fi/OTA secrets: shared with the bench tools in ../../tools/uart-sniffer/secrets.ini.
;   first flash over USB:  pio run -e brain -t upload
;   then over Wi-Fi:       pio run -e brain-ota -t upload        console: nc wayzn-esp.local 23
; Host tests (no hardware):  c++ -std=c++17 -Isrc test/host_test.cpp -o /tmp/t && /tmp/t <capture.log>
[platformio]
extra_configs = ../../tools/uart-sniffer/secrets.ini

[env:brain]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 921600
build_src_filter = +<*> -<../test/> -<../research/>
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -Wall
  '-DWIFI_SSID="${secrets.wifi_ssid}"' '-DWIFI_PSK="${secrets.wifi_psk}"' '-DOTA_PASS="${secrets.ota_pass}"' '-DAPI_TOKEN="${secrets.api_token}"' '-DSYSLOG_HOST="${secrets.syslog_host}"'

[env:brain-ota]
extends = env:brain
upload_protocol = espota
upload_port = wayzn-esp.local
upload_flags = --auth=${secrets.ota_pass}
