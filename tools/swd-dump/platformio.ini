; Read-only SWD flash reader (ESP32 bit-bang). See README.md.
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 921600
build_flags = -DPIN_SWCLK=18 -DPIN_SWDIO=19

; ESP8266 (NodeMCU / Wemos D1 mini): D1 = GPIO5 -> SWCLK, D2 = GPIO4 -> SWDIO
[env:esp8266]
platform = espressif8266
framework = arduino
board = nodemcuv2
monitor_speed = 921600
build_flags = -DPIN_SWCLK=5 -DPIN_SWDIO=4
