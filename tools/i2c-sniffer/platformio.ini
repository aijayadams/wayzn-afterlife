; Passive I2C sniffer for the Grid-EYE bus (TP1 = SCL, TP2 = SDA). See README.md.
; `pio run -e esp32dev -t upload`

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600

; Classic ESP32. GPIO21/22 are inputs here, never driven.
[env:esp32dev]
board = esp32dev
build_flags = -DPIN_SCL=21 -DPIN_SDA=22
