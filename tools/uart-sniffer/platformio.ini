; Passive dual-UART sniffer for the STM+IMP header. See README.md.
; Pick the env matching your board: `pio run -e esp32dev -t upload`

[platformio]
extra_configs = secrets.ini

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
monitor_filters = time, log2file

; Classic ESP32 (DevKitC / WROOM / WROVER). GPIO25/26 aren't strapping or PSRAM pins.
[env:esp32dev]
board = esp32dev
build_flags = -DPIN_A=25 -DPIN_B=26

; Classic ESP32, UART + I2C together: GPIO25/26 UART taps as above, plus
; GPIO21 -> TP1 (SCL), GPIO22 -> TP2 (SDA). Output adds `<secs> I <txn>` lines.
; GPIO27 -> SW1 imp-reset wire: held low from boot (cmds ih / ir).
[env:esp32dev-i2c]
board = esp32dev
build_flags = -DPIN_A=25 -DPIN_B=26 -DWITH_I2C -DPIN_SCL=21 -DPIN_SDA=22 -I../i2c-sniffer/src -DPIN_IMP_RST=27

; ESP32-S3 DevKit. Avoids USB (19/20), strapping (0/3/45/46) and flash/PSRAM pins.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DPIN_A=4 -DPIN_B=5 -DARDUINO_USB_CDC_ON_BOOT=1

; As esp32dev-i2c, plus STM32 transmit on pin A (header RX) for bench tests with the
; imp held in reset: `> <line>` sends one shell line; motion commands need `arm`.
[env:esp32dev-host]
board = esp32dev
build_flags = -DPIN_A=25 -DPIN_B=26 -DWITH_I2C -DPIN_SCL=21 -DPIN_SDA=22 -I../i2c-sniffer/src -DPIN_IMP_RST=27 -DSTM_TX

; As esp32dev-host without I2C sniffing, plus Wi-Fi, telnet console and OTA (src/net.h).
; Needs secrets.ini (copy secrets.ini.example). First flash over USB:
;   pio run -e esp32dev-net -t upload
; then over Wi-Fi:  pio run -e esp32dev-net-ota -t upload     console: nc wayzn-esp.local 23
[env:esp32dev-net]
board = esp32dev
build_flags = -DPIN_A=25 -DPIN_B=26 -DPIN_STM_RST=27 -DSTM_TX -DWITH_NET -DWITH_I2C_MASTER -DPIN_SCL=21 -DPIN_SDA=22
  '-DWIFI_SSID="${secrets.wifi_ssid}"' '-DWIFI_PSK="${secrets.wifi_psk}"' '-DOTA_PASS="${secrets.ota_pass}"'

[env:esp32dev-net-ota]
extends = env:esp32dev-net
upload_protocol = espota
upload_port = wayzn-esp.local
upload_flags = --auth=${secrets.ota_pass}
